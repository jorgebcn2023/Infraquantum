name: V1.1 tests
on:
  push:
    branches: ["main", "hardening/v1.1"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}
